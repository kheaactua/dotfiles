# Install: pip install pre-commit && pre-commit install
# (installs both the pre-commit and commit-msg hooks)

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Public repo guard: no employer-specific content, hosts, or author emails.
  # Patterns come from the gitignored .banned-patterns (see .banned-patterns.example)
  # or the file named by $BANNED_PATTERNS_FILE.
  - repo: local
    hooks:
      - id: banned-content
        name: Block private/employer-specific content
        entry: .pre-commit-hooks/check-banned-content.sh files
        language: script
      - id: banned-author
        name: Block private author/committer identity
        entry: .pre-commit-hooks/check-banned-content.sh author
        language: script
        always_run: true
        pass_filenames: false
      - id: banned-commit-message
        name: Block private content in commit message
        entry: .pre-commit-hooks/check-banned-content.sh message
        language: script
        stages: [commit-msg]
